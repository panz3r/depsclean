name: Release

on:
  schedule:
    - cron: "0 17 * * 2" # Weekly on Tuesday evenings
  workflow_dispatch:
    inputs:
      dry-run:
        description: Compute the next version and release notes without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          args: --unreleased --bump --strip all --output ${{ runner.temp }}/RELEASE_NOTES.md

      # git-cliff reports the latest tag as the next version when nothing is releasable
      - name: Check for releasable changes
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ runner.temp }}/RELEASE_NOTES.md
          VERSION: ${{ steps.notes.outputs.version }}
        run: |
          release_state="$(
            gh release view "$VERSION" --json isDraft --jq \
              'if .isDraft then "draft" else "published" end' 2>/dev/null || echo "missing"
          )"

          if [[ "$release_state" == "published" ]]; then
            echo "$VERSION is already published"
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif grep -q '[^[:space:]]' "$NOTES"; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "repair=false" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null && [[ "$release_state" != "published" ]]; then
            echo "Resuming interrupted release $VERSION"
            previous_tag="$(git describe --tags --abbrev=0 "$VERSION^" --match 'v[0-9]*' 2>/dev/null || true)"
            if [[ -n "$previous_tag" ]]; then
              echo "range=$previous_tag..$VERSION" >> "$GITHUB_OUTPUT"
            else
              echo "range=$VERSION" >> "$GITHUB_OUTPUT"
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "repair=true" >> "$GITHUB_OUTPUT"
          else
            echo "No releasable changes since the last release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate notes for interrupted release
        if: steps.check.outputs.repair == 'true'
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          args: ${{ steps.check.outputs.range }} --strip all --output ${{ runner.temp }}/RELEASE_NOTES.md

      - name: Summarize release
        if: steps.check.outputs.release == 'true'
        env:
          NOTES: ${{ runner.temp }}/RELEASE_NOTES.md
          VERSION: ${{ steps.notes.outputs.version }}
        run: |
          { echo "## $VERSION"; echo; cat "$NOTES"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Require default branch for publishing
        if: steps.check.outputs.release == 'true' && !inputs.dry-run && github.ref != 'refs/heads/main'
        run: |
          echo "Releases must be published from the main branch" >&2
          exit 1

      - name: Set up Go
        if: steps.check.outputs.release == 'true' && !inputs.dry-run && github.ref == 'refs/heads/main'
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Run tests
        if: steps.check.outputs.release == 'true' && !inputs.dry-run && github.ref == 'refs/heads/main'
        run: go test ./...

      - name: Build release binaries
        if: steps.check.outputs.release == 'true' && !inputs.dry-run && github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.notes.outputs.version }}
        run: make release-build VERSION="${VERSION#v}"

      - name: Publish GitHub release
        if: steps.check.outputs.release == 'true' && !inputs.dry-run && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ runner.temp }}/RELEASE_NOTES.md
          VERSION: ${{ steps.notes.outputs.version }}
        run: |
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --draft --target "$GITHUB_SHA" --title "$VERSION" --notes-file "$NOTES"
          fi
          gh release upload "$VERSION" builds/* --clobber
          gh release edit "$VERSION" --draft=false
